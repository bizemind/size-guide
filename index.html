<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Size Guide — One Day in November</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --border:#e0e0e0;
  --border-md:#c0c0c0;
  --text:#1a1a1a;
  --muted:#888888;
  --faint:#bbbbbb;
  --chip:#f1f1f1;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-pill:99px;
  --bust-clr:#3a7bd5;
  --waist-clr:#c4621a;
  --hip-clr:#2e9e58;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#111113;
    --surface:#1c1c1e;
    --border:#2e2e30;
    --border-md:#4a4a4c;
    --text:#f0f0f0;
    --muted:#888888;
    --faint:#555555;
    --chip:#2a2a2c;
  }
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
}
.app{max-width:520px;margin:0 auto;padding:1.25rem 1rem 3rem}

.header{display:flex;align-items:baseline;gap:8px;margin-bottom:1.25rem}
.header h1{font-size:20px;font-weight:700;letter-spacing:-0.3px}
.header span{font-size:13px;color:var(--muted)}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:1.125rem 1.125rem 1.25rem;
}
.guide-name{font-size:16px;font-weight:600;margin-bottom:2px}
.guide-sub{font-size:12px;color:var(--muted)}
.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{
  font-size:11px;padding:3px 9px;
  border-radius:var(--radius-pill);
  background:var(--chip);border:1px solid var(--border);color:var(--muted);
}

/* ── Tape ── */
.tape-wrap{margin:1.25rem 0 1.5rem}
.tape-track{
  position:relative;height:56px;
  background:linear-gradient(180deg,#f5efe0 0%,#ede4cc 100%);
  border-radius:6px;border:1px solid #d4c89a;overflow:hidden;
}
@media(prefers-color-scheme:dark){
  .tape-track{
    background:linear-gradient(180deg,#2a2620 0%,#221e14 100%);
    border-color:#4a4020;
  }
}
.tape-canvas{position:absolute;inset:0;width:100%;height:100%}
.tape-anchors{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
.tape-anchor{
  position:absolute;top:0;bottom:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transform:translateX(-50%);
  transition:opacity .2s;
}
.tape-anchor-label{
  font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:#8a7a50;transition:color .2s,transform .2s;line-height:1;margin-bottom:3px;
}
@media(prefers-color-scheme:dark){.tape-anchor-label{color:#8a7a50}}
.tape-anchor.active .tape-anchor-label{transform:scale(1.15)}
.tape-anchor-dot{
  width:5px;height:5px;border-radius:50%;background:#c8b87a;
  transition:background .2s,transform .2s;
}
.tape-anchor.active .tape-anchor-dot{transform:scale(1.5)}
.tape-anchor.filled .tape-anchor-dot{transform:scale(1.2)}
.tape-indicator{
  position:absolute;top:-4px;bottom:-4px;
  display:flex;align-items:center;justify-content:center;
  transform:translateX(-50%);
  transition:left .38s cubic-bezier(.4,0,.2,1);
  pointer-events:none;z-index:2;width:2px;
}
.tape-indicator-line{
  position:absolute;top:4px;bottom:4px;left:0;width:2px;border-radius:2px;
}
.tape-indicator-diamond{
  position:absolute;width:10px;height:10px;
  transform:rotate(45deg);border-radius:2px;
  top:50%;left:50%;margin:-5px 0 0 -5px;
}

/* ── Measure hero ── */
.measure-hero{
  background:var(--chip);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:1rem 1.125rem 1.125rem;
  margin-bottom:1.25rem;
}
.measure-prompt{
  font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.06em;color:var(--faint);margin-bottom:.25rem;
}
.measure-best-fit{
  font-size:12px;color:var(--muted);margin-bottom:1rem;
}
.measure-best-fit strong{color:var(--text);font-weight:600;}

/* 3-input grid */
.measure-inputs{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
  margin-bottom:.75rem;
}
.measure-field{display:flex;flex-direction:column;gap:5px}
.measure-field-label{
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--faint);
  transition:color .18s;
}
.measure-field-label.bust-active{color:var(--bust-clr)}
.measure-field-label.waist-active{color:var(--waist-clr)}
.measure-field-label.hip-active{color:var(--hip-clr)}
.measure-input{
  width:100%;
  font-size:22px;font-weight:600;
  padding:7px 10px;
  border:2px solid var(--border);
  border-radius:var(--radius-sm);
  background:var(--surface);
  color:var(--text);
  font-family:inherit;
  -webkit-appearance:none;appearance:none;
  transition:border-color .18s;
  min-width:0;
}
.measure-input:focus{outline:none;}
.measure-input::placeholder{color:var(--faint);font-size:18px;}
.unit-inline{
  font-size:11px;color:var(--faint);
  text-align:right;padding-right:2px;
}

/* unit toggle */
.unit-row{display:flex;gap:6px;margin-bottom:1.25rem}
.unit-btn{
  padding:5px 14px;font-size:13px;
  border:1px solid var(--border);border-radius:var(--radius-pill);
  background:none;cursor:pointer;color:var(--muted);font-family:inherit;
  transition:background .15s,color .15s;
}
.unit-btn.active{
  background:var(--chip);color:var(--text);
  font-weight:600;border-color:var(--border-md);
}

/* ── Result ── */
.result-badge{
  margin-top:.875rem;
  padding:12px 14px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  display:none;
}
.r-label{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.r-val{font-size:32px;font-weight:700;margin-top:2px;color:var(--text);line-height:1}
.r-sub{font-size:12px;color:var(--muted);margin-top:4px}
.r-note{
  font-size:12px;color:var(--muted);
  margin-top:8px;padding-top:8px;
  border-top:1px solid var(--border);display:none;
  line-height:1.5;
}

/* ── Divider ── */
.divider{border:none;border-top:1px solid var(--border);margin:1.125rem 0 1.25rem}

/* ── Chart ── */
.section-head{
  font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;color:var(--faint);margin-bottom:8px;
}
.chart-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:4px}
.chart-table th{
  text-align:left;font-size:11px;font-weight:600;color:var(--faint);
  text-transform:uppercase;letter-spacing:.04em;
  padding:4px 0;border-bottom:1px solid var(--border);
}
.chart-table th:not(:first-child){text-align:right}
.chart-table td{padding:6px 0;border-bottom:1px solid var(--border);color:var(--muted)}
.chart-table td:not(:first-child){text-align:right}
.chart-table tr.hl td{color:var(--text);font-weight:600}
.chart-table tr.hl td:first-child{position:relative}
.chart-table tr.hl td:first-child::before{
  content:'›';margin-right:4px;opacity:.5;
}
.foot-note{font-size:12px;color:var(--faint);margin-top:8px;line-height:1.5}

/* ── Signature ── */
.signature{
  text-align:center;margin-top:2.5rem;
  padding-top:1.25rem;border-top:1px solid var(--border);
}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <h1>Size Guide</h1>
    <span>for One Day in November</span>
  </div>

  <div id="cardGrid"></div>

  <div class="signature">
    <span style="font-size:12px;color:var(--faint);letter-spacing:.02em">
      <a href="http://bizemind.com" target="_blank" rel="noopener"
        style="font-size:12px;color:var(--faint);text-decoration:none">bizemind</a>
      — Built by Creatis
    </span>
  </div>

</div>
<script>
/* ── Size data: boundary rule = size DOWN
   e.g. bust 35" → XS (upper bound is exclusive: range is [lo, hi) )        */
const SIZES = ['XS','S','M','L','XL'];

const chartData = {
  bust:  {
    in: [[32,34],[35,37],[38,40],[41,43],[44,46]],
    cm: [[81,86],[89,94],[97,102],[104,109],[112,117]]
  },
  waist: {
    in: [[25,27],[28,30],[31,33],[34,36],[37,39]],
    cm: [[64,69],[71,76],[79,84],[86,91],[94,99]]
  },
  hip:   {
    in: [[34,36],[37,39],[40,42],[43,45],[46,48]],
    cm: [[86,91],[94,99],[102,107],[109,114],[117,122]]
  }
};

/* zone config */
const ZONES = {
  bust:  {pct:22, clr:'var(--bust-clr)',  label:'Bust'},
  waist: {pct:50, clr:'var(--waist-clr)', label:'Waist'},
  hip:   {pct:78, clr:'var(--hip-clr)',   label:'Hip'},
};

const HINTS = {
  bust:  'Fullest part of your chest.',
  waist: 'Narrowest part of your torso.',
  hip:   'Fullest part of your hips and seat.',
};

/* state */
const state = {unit:'in', bust:'', waist:'', hip:''};

/* ── Tape canvas ── */
function drawTape(canvas){
  const dpr = window.devicePixelRatio||1;
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  if(!W||!H) return;
  canvas.width = W*dpr; canvas.height = H*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const dark = window.matchMedia('(prefers-color-scheme:dark)').matches;
  const clr  = dark?'rgba(200,180,100,0.32)':'rgba(100,80,20,0.22)';
  const clrM = dark?'rgba(200,180,100,0.55)':'rgba(100,80,20,0.42)';
  const steps=32, step=W/steps;
  for(let i=0;i<=steps;i++){
    const x=i*step, major=i%4===0, th=major?H*.42:H*.26;
    ctx.strokeStyle=major?clrM:clr; ctx.lineWidth=major?1.2:.8;
    ctx.beginPath();
    ctx.moveTo(x,0);ctx.lineTo(x,th);
    ctx.moveTo(x,H);ctx.lineTo(x,H-th);
    ctx.stroke();
  }
}

/* ── Size resolver ──
   For each measurement: find which size index it falls in (size-down rule).
   Returns index or -1 if out of range.                                       */
function resolveOne(val, ranges){
  if(val==='' || val===null || val===undefined) return null; // not entered
  const v = parseFloat(val);
  if(isNaN(v)) return null;
  for(let i=0;i<ranges.length;i++){
    const [lo,hi]=ranges[i];
    if(v>=lo && v<=hi) return i;
  }
  return -1; // out of range (including gap between sizes)
}

function resolveSize(unit){
  const bust  = resolveOne(state.bust,  chartData.bust[unit]);
  const waist = resolveOne(state.waist, chartData.waist[unit]);
  const hip   = resolveOne(state.hip,   chartData.hip[unit]);

  const entered = [
    bust  !== null ? {key:'bust',  idx:bust}  : null,
    waist !== null ? {key:'waist', idx:waist} : null,
    hip   !== null ? {key:'hip',   idx:hip}   : null,
  ].filter(Boolean);

  if(!entered.length) return null;

  // Check if any measurement is out of range
  const outOfRange = entered.filter(e=>e.idx===-1);

  // Valid entries only
  const valid = entered.filter(e=>e.idx!==-1);
  if(!valid.length) return {size:null, note:'Measurements are outside our size range.', deciding:null};

  // Find the most common size index among valid entries
  const counts = {};
  valid.forEach(e=>{ counts[e.idx]=(counts[e.idx]||0)+1; });
  const maxCount = Math.max(...Object.values(counts));
  const candidates = Object.keys(counts)
    .filter(k=>counts[k]===maxCount)
    .map(Number)
    .sort((a,b)=>a-b);

  // If tie, pick the smaller size (size-down principle)
  const chosen = candidates[0];

  // Build note
  let note = '';
  const labels = {bust:'Bust', waist:'Waist', hip:'Hip'};

  if(valid.length > 1){
    const deciding = valid.find(e=>e.idx===chosen);
    const conflicts = valid.filter(e=>e.idx!==chosen);
    if(conflicts.length){
      const conflictNames = conflicts.map(e=>labels[e.key]).join(' & ');
      const decidingNames = valid.filter(e=>e.idx===chosen).map(e=>labels[e.key]).join(' & ');
      note = `${decidingNames} measurement${valid.filter(e=>e.idx===chosen).length>1?'s':''} determined the size. ${conflictNames} ${conflicts.length>1?'fall':'falls'} in an adjacent size — the elastic will accommodate.`;
    }
  }
  if(outOfRange.length){
    const names = outOfRange.map(e=>labels[e.key]).join(' & ');
    note += (note?' ':'')+`${names} measurement${outOfRange.length>1?'s are':' is'} outside our size range.`;
  }

  // Which measurements are filled and deciding
  const decidingKeys = valid.filter(e=>e.idx===chosen).map(e=>e.key);

  return {size:SIZES[chosen], idx:chosen, note, decidingKeys};
}

/* ── Build card ── */
function buildCard(){
  const card = document.createElement('div');
  card.className='card';
  card.innerHTML=`
    <div class="guide-name">Clothing sizing</div>
    <div class="guide-sub">Bust · Waist · Hip</div>
    <div class="tag-row">
      <span class="tag">Clothing</span>
      <span class="tag">Dress</span>
      <span class="tag">Tops</span>
    </div>

    <!-- Tape -->
    <div class="tape-wrap">
      <div class="tape-track">
        <canvas class="tape-canvas"></canvas>
        <div class="tape-anchors">
          ${Object.entries(ZONES).map(([k,z])=>`
            <div class="tape-anchor" data-zone="${k}" style="left:${z.pct}%">
              <div class="tape-anchor-label">${z.label}</div>
              <div class="tape-anchor-dot"></div>
            </div>`).join('')}
        </div>
        <div class="tape-indicator" id="tapeIndicator">
          <div class="tape-indicator-line"></div>
          <div class="tape-indicator-diamond"></div>
        </div>
      </div>
    </div>

    <!-- Measurement inputs -->
    <div class="measure-hero">
      <div class="measure-prompt">Your measurements</div>
      <div class="measure-best-fit">For best fit, enter all three — <strong>Bust, Waist & Hip.</strong></div>

      <div class="measure-inputs">
        <div class="measure-field">
          <div class="measure-field-label" id="labelBust">Bust</div>
          <input class="measure-input" id="inputBust" type="number"
            inputmode="decimal" step="0.5" placeholder="0" autocomplete="off">
          <div class="unit-inline gUnitHint">in</div>
        </div>
        <div class="measure-field">
          <div class="measure-field-label" id="labelWaist">Waist</div>
          <input class="measure-input" id="inputWaist" type="number"
            inputmode="decimal" step="0.5" placeholder="0" autocomplete="off">
          <div class="unit-inline gUnitHint">in</div>
        </div>
        <div class="measure-field">
          <div class="measure-field-label" id="labelHip">Hip</div>
          <input class="measure-input" id="inputHip" type="number"
            inputmode="decimal" step="0.5" placeholder="0" autocomplete="off">
          <div class="unit-inline gUnitHint">in</div>
        </div>
      </div>

      <!-- Unit toggle inside hero -->
      <div class="unit-row" id="gUnitRow">
        <button class="unit-btn active" data-v="in">in</button>
        <button class="unit-btn" data-v="cm">cm</button>
      </div>

      <!-- Result -->
      <div class="result-badge" id="resultBadge">
        <div class="r-label">Recommended size</div>
        <div class="r-val" id="rVal"></div>
        <div class="r-sub" id="rSub"></div>
        <div class="r-note" id="rNote"></div>
      </div>
    </div>

    <hr class="divider">

    <!-- Size chart — 3 columns -->
    <div class="section-head">Size chart <span class="gUnitChartLabel" style="font-weight:400;text-transform:none;letter-spacing:0">(in)</span></div>
    <table class="chart-table">
      <thead>
        <tr>
          <th>Size</th>
          <th>Bust</th>
          <th>Waist</th>
          <th>Hip</th>
        </tr>
      </thead>
      <tbody id="chartBody"></tbody>
    </table>
    <div class="foot-note">
      Dresses are 51–52" in length. Measure over the fullest point of each zone.<br>
      At size boundaries, we recommend sizing down — the elastic will accommodate.
    </div>
  `;

  /* refs */
  const canvas    = card.querySelector('.tape-canvas');
  const indicator = card.querySelector('#tapeIndicator');
  const anchors   = card.querySelectorAll('.tape-anchor');
  const inputBust  = card.querySelector('#inputBust');
  const inputWaist = card.querySelector('#inputWaist');
  const inputHip   = card.querySelector('#inputHip');
  const labelBust  = card.querySelector('#labelBust');
  const labelWaist = card.querySelector('#labelWaist');
  const labelHip   = card.querySelector('#labelHip');
  const resultBadge= card.querySelector('#resultBadge');
  const rVal       = card.querySelector('#rVal');
  const rSub       = card.querySelector('#rSub');
  const rNote      = card.querySelector('#rNote');

  /* tape zone setter */
  function setZone(type){
    const z = ZONES[type];
    const clr = getComputedStyle(document.documentElement)
      .getPropertyValue(z.clr.replace('var(','').replace(')','').trim()) || z.clr;
    indicator.style.left = z.pct+'%';
    indicator.querySelector('.tape-indicator-line').style.background    = z.clr;
    indicator.querySelector('.tape-indicator-diamond').style.background = z.clr;
    anchors.forEach(a=>{
      const on = a.dataset.zone===type;
      a.classList.toggle('active', on);
      a.querySelector('.tape-anchor-label').style.color    = on ? z.clr : '';
      a.querySelector('.tape-anchor-dot').style.background = on ? z.clr : '';
    });
    // label colours
    labelBust.className  = 'measure-field-label'+(type==='bust'  ? ' bust-active'  : '');
    labelWaist.className = 'measure-field-label'+(type==='waist' ? ' waist-active' : '');
    labelHip.className   = 'measure-field-label'+(type==='hip'   ? ' hip-active'   : '');
  }

  /* filled dot on anchor when value is present */
  function updateFilledDots(){
    const filled = {bust:!!parseFloat(state.bust), waist:!!parseFloat(state.waist), hip:!!parseFloat(state.hip)};
    anchors.forEach(a=>{
      a.classList.toggle('filled', filled[a.dataset.zone]);
      if(filled[a.dataset.zone] && !a.classList.contains('active')){
        a.querySelector('.tape-anchor-dot').style.background = ZONES[a.dataset.zone].clr;
        a.querySelector('.tape-anchor-dot').style.opacity = '0.5';
      } else if(!a.classList.contains('active')){
        a.querySelector('.tape-anchor-dot').style.background = '';
        a.querySelector('.tape-anchor-dot').style.opacity = '';
      }
    });
  }

  /* input border colour */
  function setBorderClr(input, clrVar){
    input.style.borderColor = clrVar;
  }
  function clearBorder(input){ input.style.borderColor = ''; }

  /* focus handlers */
  [
    [inputBust,  'bust'],
    [inputWaist, 'waist'],
    [inputHip,   'hip'],
  ].forEach(([inp, zone])=>{
    inp.addEventListener('focus', ()=>{
      setZone(zone);
      setBorderClr(inp, ZONES[zone].clr);
    });
    inp.addEventListener('blur', ()=>{
      clearBorder(inp);
    });
    inp.addEventListener('input', function(){
      state[zone] = this.value;
      updateFilledDots();
      calcAndRender(card);
    });
  });

  /* unit toggle */
  card.querySelector('#gUnitRow').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    state.unit = b.dataset.v;
    card.querySelectorAll('#gUnitRow button').forEach(x=>x.classList.toggle('active',x===b));
    // clear values on unit switch
    state.bust=''; state.waist=''; state.hip='';
    inputBust.value=''; inputWaist.value=''; inputHip.value='';
    resultBadge.style.display='none';
    card.querySelectorAll('.gUnitHint').forEach(el=>el.textContent=b.dataset.v);
    card.querySelector('.gUnitChartLabel').textContent='('+b.dataset.v+')';
    renderChart(card, null);
    updateFilledDots();
  });

  /* init */
  requestAnimationFrame(()=>{
    drawTape(canvas);
    setZone('bust');
    inputBust.focus();
  });
  window.addEventListener('resize', ()=>drawTape(canvas), {passive:true});

  renderChart(card, null);
  return card;
}

/* ── Render chart ── */
function renderChart(card, highlightIdx){
  const u = state.unit;
  card.querySelector('#chartBody').innerHTML = SIZES.map((sz,i)=>{
    const b = chartData.bust[u][i];
    const w = chartData.waist[u][i];
    const h = chartData.hip[u][i];
    const hl = i===highlightIdx;
    return `<tr class="${hl?'hl':''}">
      <td>${sz}</td>
      <td>${b[0]}–${b[1]}</td>
      <td>${w[0]}–${w[1]}</td>
      <td>${h[0]}–${h[1]}</td>
    </tr>`;
  }).join('');
}

/* ── Calc & render result ── */
function calcAndRender(card){
  const res = resolveSize(state.unit);
  const badge = card.querySelector('#resultBadge');
  const rVal  = card.querySelector('#rVal');
  const rSub  = card.querySelector('#rSub');
  const rNote = card.querySelector('#rNote');

  // only show if at least one value entered
  const anyEntered = state.bust||state.waist||state.hip;
  if(!anyEntered){ badge.style.display='none'; renderChart(card,null); return; }

  if(!res){ badge.style.display='none'; renderChart(card,null); return; }

  if(!res.size){
    rVal.textContent  = '—';
    rSub.textContent  = '';
    rNote.textContent = res.note||'';
    rNote.style.display = res.note ? 'block':'none';
    badge.style.display = 'block';
    renderChart(card, null);
    return;
  }

  rVal.textContent = res.size;

  // sub: show which measurements contributed
  const entered = ['bust','waist','hip'].filter(k=>parseFloat(state[k]));
  const labels  = {bust:'Bust',waist:'Waist',hip:'Hip'};
  rSub.textContent = 'Based on: '+entered.map(k=>labels[k]).join(', ');

  rNote.textContent  = res.note||'';
  rNote.style.display = res.note ? 'block':'none';
  badge.style.display = 'block';

  renderChart(card, res.idx);
}

document.getElementById('cardGrid').appendChild(buildCard());
</script>
</body>
</html>
