<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Size Guide — Creatis</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --border:#e0e0e0;
  --border-md:#c0c0c0;
  --text:#1a1a1a;
  --muted:#888888;
  --faint:#bbbbbb;
  --chip:#f1f1f1;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-pill:99px;
  --bust-clr:#3a7bd5;
  --waist-clr:#c4621a;
  --hip-clr:#2e9e58;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#111113;
    --surface:#1c1c1e;
    --border:#2e2e30;
    --border-md:#4a4a4c;
    --text:#f0f0f0;
    --muted:#888888;
    --faint:#555555;
    --chip:#2a2a2c;
  }
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
}
.app{max-width:520px;margin:0 auto;padding:1.25rem 1rem 3rem}

/* header */
.header{display:flex;align-items:baseline;gap:8px;margin-bottom:1.25rem}
.header h1{font-size:20px;font-weight:700;letter-spacing:-0.3px}
.header span{font-size:13px;color:var(--muted)}

/* card */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:1rem 1.125rem;
  margin-bottom:.75rem;
}
.guide-name{font-size:16px;font-weight:600;margin-bottom:2px}
.guide-sub{font-size:12px;color:var(--muted)}
.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{
  font-size:11px;padding:3px 9px;
  border-radius:var(--radius-pill);
  background:var(--chip);border:1px solid var(--border);color:var(--muted);
}

/* ── Sliding tape ── */
.tape-wrap{
  margin:1.125rem 0 0.25rem;
  position:relative;
  user-select:none;
}
.tape-track{
  position:relative;
  height:56px;
  background:linear-gradient(180deg,#f5efe0 0%,#ede4cc 100%);
  border-radius:6px;
  border:1px solid #d4c89a;
  overflow:hidden;
}
@media(prefers-color-scheme:dark){
  .tape-track{
    background:linear-gradient(180deg,#2a2620 0%,#221e14 100%);
    border-color:#4a4020;
  }
}
/* tick marks drawn by JS into canvas */
.tape-canvas{
  position:absolute;inset:0;
  width:100%;height:100%;
}
/* anchor labels */
.tape-anchors{
  position:absolute;top:0;left:0;right:0;bottom:0;
  pointer-events:none;
}
.tape-anchor{
  position:absolute;top:0;bottom:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transform:translateX(-50%);
}
.tape-anchor-label{
  font-size:10px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;
  color:#8a7a50;
  transition:color .2s,transform .2s;
  line-height:1;
  margin-bottom:3px;
}
@media(prefers-color-scheme:dark){
  .tape-anchor-label{color:#8a7a50}
}
.tape-anchor.active .tape-anchor-label{
  transform:scale(1.15);
}
.tape-anchor-dot{
  width:5px;height:5px;border-radius:50%;
  background:#c8b87a;
  transition:background .2s,transform .2s;
}
.tape-anchor.active .tape-anchor-dot{
  transform:scale(1.4);
}
/* the sliding indicator */
.tape-indicator{
  position:absolute;top:-6px;bottom:-6px;
  width:2px;
  border-radius:2px;
  transform:translateX(-50%);
  transition:left .38s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
  z-index:2;
}
.tape-indicator::before{
  content:'';
  position:absolute;top:6px;bottom:6px;left:0;
  width:2px;border-radius:2px;
}
/* diamond head on indicator */
.tape-indicator::after{
  content:'';
  position:absolute;
  top:50%;left:50%;
  width:10px;height:10px;
  transform:translate(-50%,-50%) rotate(45deg);
  border-radius:2px;
}
/* colours per zone — set via inline style on .tape-indicator */

/* ── Accordion ── */
.accordion-toggle{
  margin-top:1rem;font-size:13px;font-weight:500;
  cursor:pointer;color:var(--muted);
  -webkit-tap-highlight-color:transparent;
}
.accordion-toggle:hover{color:var(--text)}
.accordion-content{
  margin-top:12px;border-top:1px solid var(--border);
  padding-top:14px;display:none;
}
.accordion-content.open{display:block}

/* controls */
.section-head{
  font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;color:var(--faint);margin-bottom:8px;
}
.seg{
  display:flex;border:1px solid var(--border);
  border-radius:var(--radius-sm);overflow:hidden;margin-bottom:14px;
}
.seg button{
  flex:1;padding:7px 0;font-size:13px;
  background:none;border:none;cursor:pointer;
  color:var(--muted);font-family:inherit;
}
.seg button.active{background:var(--chip);color:var(--text);font-weight:600}
.unit-row{display:flex;gap:6px;margin-bottom:14px}
.unit-btn{
  padding:5px 13px;font-size:13px;
  border:1px solid var(--border);border-radius:var(--radius-pill);
  background:none;cursor:pointer;color:var(--muted);font-family:inherit;
}
.unit-btn.active{
  background:var(--chip);color:var(--text);
  font-weight:600;border-color:var(--border-md);
}
.input-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.input-row input{
  width:90px;padding:7px 10px;font-size:14px;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text);
  font-family:inherit;-webkit-appearance:none;appearance:none;
}
.input-row input:focus{outline:2px solid #555;outline-offset:1px}
.unit-label{font-size:13px;color:var(--muted)}

/* result */
.result-badge{
  padding:10px 14px;background:var(--chip);
  border-radius:var(--radius-sm);margin-bottom:14px;display:none;
}
.r-label{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.r-val{font-size:24px;font-weight:600;margin-top:2px;color:var(--text)}
.r-range{font-size:12px;color:var(--muted);margin-top:2px}
.r-note{
  font-size:12px;color:var(--muted);
  margin-top:6px;padding-top:6px;
  border-top:1px solid var(--border);display:none;
}

/* chart */
.chart-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:4px}
.chart-table th{
  text-align:left;font-size:11px;font-weight:600;color:var(--faint);
  text-transform:uppercase;letter-spacing:.04em;
  padding:4px 0;border-bottom:1px solid var(--border);
}
.chart-table td{padding:6px 0;border-bottom:1px solid var(--border);color:var(--muted)}
.chart-table td:last-child{text-align:right}
.chart-table tr.hl td{color:var(--text);font-weight:600}
.foot-note{font-size:12px;color:var(--faint);margin-top:8px}

/* signature */
.signature{
  text-align:center;margin-top:2.5rem;
  padding-top:1.25rem;border-top:1px solid var(--border);
}
.signature a{
  font-size:12px;color:var(--faint);text-decoration:none;
  letter-spacing:.02em;transition:color .15s;
}
.signature a:hover{color:var(--muted)}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <h1>Size Guide</h1>
    <span>by Creatis</span>
  </div>

  <div id="cardGrid"></div>

  <div class="signature">
    <a href="https://creatis.in/pages/stack" target="_blank" rel="noopener">Built by The Creatis Stack</a>
  </div>

</div>
<script>
const sizes = ["XS/S","S/M","M/L","L/XL","XL/XXL"];
const chartData = {
  bust:  {in:[[32,35],[35,38],[38,41],[41,44],[44,47]],cm:[[81,89],[89,96],[96,104],[104,112],[112,119]]},
  waist: {in:[[26,29],[29,32],[32,35],[35,38],[38,41]],cm:[[66,74],[74,81],[81,89],[89,97],[97,104]]},
  hip:   {in:[[34,37],[37,40],[40,43],[43,46],[46,49]],cm:[[86,94],[94,102],[102,109],[109,117],[117,124]]}
};

/* zone config: left% position on tape, colour */
const ZONES = {
  bust:  {pct:22, clr:'#3a7bd5', label:'Bust'},
  waist: {pct:50, clr:'#c4621a', label:'Waist'},
  hip:   {pct:78, clr:'#2e9e58', label:'Hip'},
};

const state = {type:'bust', unit:'in', value:''};

/* ── Draw tick marks on canvas ── */
function drawTape(canvas){
  const dpr = window.devicePixelRatio||1;
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const dark = window.matchMedia('(prefers-color-scheme:dark)').matches;
  const tickClr  = dark ? 'rgba(200,180,100,0.35)' : 'rgba(100,80,20,0.25)';
  const tickClrM = dark ? 'rgba(200,180,100,0.55)' : 'rgba(100,80,20,0.45)';

  const step = W / 28;   // ~28 divisions across the tape
  for(let i=0; i<=28; i++){
    const x = i * step;
    const major = i % 4 === 0;
    const tickH = major ? H * 0.45 : H * 0.28;
    ctx.strokeStyle = major ? tickClrM : tickClr;
    ctx.lineWidth   = major ? 1.2 : 0.8;
    ctx.beginPath();
    // ticks from top and bottom edges
    ctx.moveTo(x, 0);
    ctx.lineTo(x, tickH);
    ctx.moveTo(x, H);
    ctx.lineTo(x, H - tickH);
    ctx.stroke();
  }
}

/* ── Build garment card ── */
function buildCard(){
  const card = document.createElement('div');
  card.className = 'card';

  card.innerHTML = `
    <div class="guide-name">Garment sizing</div>
    <div class="guide-sub">Bust · Waist · Hip</div>
    <div class="tag-row">
      <span class="tag">Clothing</span>
      <span class="tag">Dress</span>
      <span class="tag">Tops</span>
    </div>

    <!-- Sliding tape -->
    <div class="tape-wrap">
      <div class="tape-track">
        <canvas class="tape-canvas"></canvas>
        <div class="tape-anchors">
          ${Object.entries(ZONES).map(([k,z])=>`
            <div class="tape-anchor" data-zone="${k}" style="left:${z.pct}%">
              <div class="tape-anchor-label">${z.label}</div>
              <div class="tape-anchor-dot"></div>
            </div>`).join('')}
        </div>
        <div class="tape-indicator" id="tapeIndicator"></div>
      </div>
    </div>

    <div class="accordion-toggle">View sizing ›</div>
    <div class="accordion-content">
      <div class="section-head">Measurement point</div>
      <div class="seg" id="gTypeSeg">
        <button data-v="bust"  class="active">Bust</button>
        <button data-v="waist">Waist</button>
        <button data-v="hip">Hip</button>
      </div>
      <div class="section-head">Unit</div>
      <div class="unit-row" id="gUnitRow">
        <button class="unit-btn active" data-v="in">in</button>
        <button class="unit-btn" data-v="cm">cm</button>
      </div>
      <div class="section-head">Your measurement</div>
      <div class="input-row">
        <input type="number" class="gValueInput" inputmode="decimal" step="0.5" placeholder="e.g. 36">
        <span class="unit-label gUnitLabel">in</span>
      </div>
      <div class="result-badge gResult">
        <div class="r-label">Recommended size</div>
        <div class="r-val gSizeVal"></div>
        <div class="r-range gSizeRange"></div>
        <div class="r-note gSizeNote"></div>
      </div>
      <div class="section-head">Size chart</div>
      <table class="chart-table">
        <thead><tr><th>Size</th><th class="gChartHead">Range (in)</th></tr></thead>
        <tbody class="gChartBody"></tbody>
      </table>
      <div class="foot-note">Dresses are 51–52" in length. Measure over the fullest point.</div>
    </div>
  `;

  /* ── Tape init ── */
  const canvas    = card.querySelector('.tape-canvas');
  const indicator = card.querySelector('#tapeIndicator');
  const anchors   = card.querySelectorAll('.tape-anchor');

  function setTapeZone(type, pulse){
    const z = ZONES[type];
    // move indicator
    indicator.style.left = z.pct + '%';
    indicator.style.setProperty('--iz-clr', z.clr);
    indicator.style.background = 'transparent';
    indicator.querySelector
      ? null : null; // handled via ::before/after + inline vars below
    // set colour on pseudo via box-shadow trick — use outline instead
    indicator.style.outline = 'none';
    // Actually set colour directly on the element children
    updateIndicatorColor(indicator, z.clr, pulse);

    // update anchor highlights
    anchors.forEach(a=>{
      const active = a.dataset.zone === type;
      a.classList.toggle('active', active);
      a.querySelector('.tape-anchor-label').style.color = active ? z.clr : '';
      a.querySelector('.tape-anchor-dot').style.background = active ? z.clr : '';
    });
  }

  // Build indicator DOM properly (can't use ::before/after with JS colour)
  indicator.innerHTML = `
    <div style="
      position:absolute;top:8px;bottom:8px;left:0;width:2px;
      border-radius:2px;background:currentColor;
    "></div>
    <div style="
      position:absolute;top:50%;left:50%;
      width:10px;height:10px;
      transform:translate(-50%,-50%) rotate(45deg);
      border-radius:2px;background:currentColor;
    "></div>`;

  function updateIndicatorColor(el, clr, pulse){
    el.style.color = clr;
    if(pulse){
      el.style.opacity = '0';
      requestAnimationFrame(()=>{
        el.style.transition = 'left .38s cubic-bezier(.4,0,.2,1), opacity .15s';
        el.style.opacity = '1';
        setTimeout(()=>{ el.style.transition = 'left .38s cubic-bezier(.4,0,.2,1)'; }, 400);
      });
    }
  }

  // Draw tape after layout
  requestAnimationFrame(()=>{
    drawTape(canvas);
    setTapeZone(state.type, false);
  });
  window.addEventListener('resize', ()=> drawTape(canvas), {passive:true});

  /* ── Accordion ── */
  const toggle = card.querySelector('.accordion-toggle');
  const acc    = card.querySelector('.accordion-content');
  toggle.addEventListener('click', function(){
    const open = acc.classList.toggle('open');
    this.textContent = open ? 'Hide sizing ↑' : 'View sizing ›';
    if(open){ renderChart(card); calcSize(card); }
  });

  /* ── Tab: measurement point ── */
  card.querySelector('#gTypeSeg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    state.type = b.dataset.v;
    card.querySelectorAll('#gTypeSeg button').forEach(x=>x.classList.toggle('active', x===b));
    setTapeZone(state.type, false);
    renderChart(card); calcSize(card);
  });

  /* ── Unit toggle ── */
  card.querySelector('#gUnitRow').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    state.unit = b.dataset.v;
    card.querySelectorAll('#gUnitRow button').forEach(x=>x.classList.toggle('active', x===b));
    card.querySelector('.gUnitLabel').textContent = b.dataset.v;
    card.querySelector('.gChartHead').textContent = 'Range ('+b.dataset.v+')';
    renderChart(card); calcSize(card);
  });

  /* ── Value input ── */
  card.querySelector('.gValueInput').addEventListener('input', function(){
    state.value = this.value;
    if(parseFloat(this.value)) setTapeZone(state.type, true);
    calcSize(card);
  });

  renderChart(card);
  return card;
}

function renderChart(card){
  const rows = chartData[state.type][state.unit];
  const v    = parseFloat(state.value);
  card.querySelector('.gChartBody').innerHTML = rows.map((r,i)=>{
    const hl = !isNaN(v) && v>=r[0] && v<=r[1];
    return `<tr class="${hl?'hl':''}"><td>${sizes[i]}</td><td>${r[0]}–${r[1]}</td></tr>`;
  }).join('');
}

function calcSize(card){
  const v   = parseFloat(state.value);
  const res = card.querySelector('.gResult');
  if(!v){ res.style.display='none'; renderChart(card); return; }
  const rows = chartData[state.type][state.unit];
  const matches = rows.reduce((a,r,i)=> r[0]<=v&&v<=r[1] ? [...a,i] : a, []);
  if(!matches.length){
    card.querySelector('.gSizeVal').textContent  = 'Out of range';
    card.querySelector('.gSizeRange').textContent = '';
    card.querySelector('.gSizeNote').style.display = 'none';
    res.style.display = 'block'; renderChart(card); return;
  }
  const idx = matches[matches.length-1];
  card.querySelector('.gSizeVal').textContent   = sizes[idx];
  card.querySelector('.gSizeRange').textContent = rows[idx][0]+'–'+rows[idx][1]+' '+state.unit;
  const note = card.querySelector('.gSizeNote');
  if(matches.length>1){ note.textContent='Between sizes — relaxed fit recommended.'; note.style.display='block'; }
  else { note.style.display='none'; }
  res.style.display = 'block';
  renderChart(card);
}

document.getElementById('cardGrid').appendChild(buildCard());
</script>
</body>
</html>
