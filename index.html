<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Size Guide — Creatis</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --border:#e0e0e0;
  --border-md:#c0c0c0;
  --text:#1a1a1a;
  --muted:#888888;
  --faint:#bbbbbb;
  --chip:#f1f1f1;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-pill:99px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#111113;
    --surface:#1c1c1e;
    --border:#2e2e30;
    --border-md:#4a4a4c;
    --text:#f0f0f0;
    --muted:#888888;
    --faint:#555555;
    --chip:#2a2a2c;
  }
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
}
.app{max-width:520px;margin:0 auto;padding:1.25rem 1rem 3rem}

.header{display:flex;align-items:baseline;gap:8px;margin-bottom:1.25rem}
.header h1{font-size:20px;font-weight:700;letter-spacing:-0.3px}
.header span{font-size:13px;color:var(--muted)}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:1.125rem 1.125rem 1.25rem;
}
.guide-name{font-size:16px;font-weight:600;margin-bottom:2px}
.guide-sub{font-size:12px;color:var(--muted)}
.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{
  font-size:11px;padding:3px 9px;
  border-radius:var(--radius-pill);
  background:var(--chip);border:1px solid var(--border);color:var(--muted);
}

/* ── Tape ── */
.tape-wrap{margin:1.25rem 0 1.5rem}
.tape-track{
  position:relative;height:56px;
  background:linear-gradient(180deg,#f5efe0 0%,#ede4cc 100%);
  border-radius:6px;border:1px solid #d4c89a;overflow:hidden;
}
@media(prefers-color-scheme:dark){
  .tape-track{
    background:linear-gradient(180deg,#2a2620 0%,#221e14 100%);
    border-color:#4a4020;
  }
}
.tape-canvas{position:absolute;inset:0;width:100%;height:100%}
.tape-anchors{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
.tape-anchor{
  position:absolute;top:0;bottom:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transform:translateX(-50%);
}
.tape-anchor-label{
  font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:#8a7a50;transition:color .2s,transform .2s;line-height:1;margin-bottom:3px;
}
@media(prefers-color-scheme:dark){.tape-anchor-label{color:#8a7a50}}
.tape-anchor.active .tape-anchor-label{transform:scale(1.15)}
.tape-anchor-dot{
  width:5px;height:5px;border-radius:50%;background:#c8b87a;
  transition:background .2s,transform .2s;
}
.tape-anchor.active .tape-anchor-dot{transform:scale(1.4)}
.tape-indicator{
  position:absolute;top:-4px;bottom:-4px;
  display:flex;align-items:center;justify-content:center;
  transform:translateX(-50%);
  transition:left .38s cubic-bezier(.4,0,.2,1);
  pointer-events:none;z-index:2;width:2px;
}
.tape-indicator-line{
  position:absolute;top:4px;bottom:4px;left:0;width:2px;border-radius:2px;
}
.tape-indicator-diamond{
  position:absolute;width:10px;height:10px;
  transform:rotate(45deg);border-radius:2px;
  top:50%;left:50%;margin:-5px 0 0 -5px;
}

/* ── Measurement hero ── */
.measure-hero{
  background:var(--chip);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:1rem 1.125rem 1.125rem;
  margin-bottom:1.25rem;
}
.measure-prompt{
  font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.06em;color:var(--faint);margin-bottom:.75rem;
}
.measure-input-row{
  display:flex;align-items:center;gap:10px;
}
.measure-input{
  flex:1;
  font-size:28px;font-weight:600;
  padding:8px 12px;
  border:2px solid var(--border);
  border-radius:var(--radius-sm);
  background:var(--surface);
  color:var(--text);
  font-family:inherit;
  -webkit-appearance:none;appearance:none;
  transition:border-color .18s;
  min-width:0;
}
.measure-input:focus{
  outline:none;
  border-color:var(--border-md);
}
.measure-input::placeholder{color:var(--faint)}
.measure-unit{
  font-size:18px;font-weight:500;color:var(--muted);
  flex-shrink:0;
}
.measure-hint{
  font-size:12px;color:var(--faint);margin-top:.625rem;
}

/* ── Result badge ── */
.result-badge{
  margin-top:.875rem;
  padding:10px 14px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  display:none;
}
.r-label{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.r-val{font-size:26px;font-weight:700;margin-top:2px;color:var(--text)}
.r-range{font-size:12px;color:var(--muted);margin-top:2px}
.r-note{
  font-size:12px;color:var(--muted);
  margin-top:6px;padding-top:6px;
  border-top:1px solid var(--border);display:none;
}

/* ── Controls ── */
.section-head{
  font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;color:var(--faint);margin-bottom:8px;
}
.unit-row{display:flex;gap:6px;margin-bottom:1.25rem}
.unit-btn{
  padding:5px 14px;font-size:13px;
  border:1px solid var(--border);border-radius:var(--radius-pill);
  background:none;cursor:pointer;color:var(--muted);font-family:inherit;
  transition:background .15s,color .15s;
}
.unit-btn.active{
  background:var(--chip);color:var(--text);
  font-weight:600;border-color:var(--border-md);
}
.seg{
  display:flex;border:1px solid var(--border);
  border-radius:var(--radius-sm);overflow:hidden;margin-bottom:1.25rem;
}
.seg button{
  flex:1;padding:7px 0;font-size:13px;
  background:none;border:none;cursor:pointer;
  color:var(--muted);font-family:inherit;
}
.seg button.active{background:var(--chip);color:var(--text);font-weight:600}

/* ── Divider ── */
.divider{
  border:none;border-top:1px solid var(--border);
  margin:1.125rem 0 1.25rem;
}

/* ── Chart ── */
.chart-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:4px}
.chart-table th{
  text-align:left;font-size:11px;font-weight:600;color:var(--faint);
  text-transform:uppercase;letter-spacing:.04em;
  padding:4px 0;border-bottom:1px solid var(--border);
}
.chart-table td{padding:6px 0;border-bottom:1px solid var(--border);color:var(--muted)}
.chart-table td:last-child{text-align:right}
.chart-table tr.hl td{color:var(--text);font-weight:600}
.foot-note{font-size:12px;color:var(--faint);margin-top:8px}

/* ── Signature ── */
.signature{
  text-align:center;margin-top:2.5rem;
  padding-top:1.25rem;border-top:1px solid var(--border);
}
.signature a{
  font-size:12px;color:var(--faint);text-decoration:none;
  letter-spacing:.02em;transition:color .15s;
}
.signature a:hover{color:var(--muted)}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <h1>Size Guide</h1>
    <span>for One Day in November</span>
  </div>

  <div id="cardGrid"></div>

  <div class="signature">
    <span style="font-size:12px;color:var(--faint);letter-spacing:.02em"><a href="http://bizemind.com" target="_blank" rel="noopener" style="font-size:12px;color:var(--faint);text-decoration:none">bizemind</a> — Built by Creatis</span>
  </div>

</div>
<script>
const sizes = ["XS/S","S/M","M/L","L/XL","XL/XXL"];
const chartData = {
  bust:  {in:[[32,35],[35,38],[38,41],[41,44],[44,47]],cm:[[81,89],[89,96],[96,104],[104,112],[112,119]]},
  waist: {in:[[26,29],[29,32],[32,35],[35,38],[38,41]],cm:[[66,74],[74,81],[81,89],[89,97],[97,104]]},
  hip:   {in:[[34,37],[37,40],[40,43],[43,46],[46,49]],cm:[[86,94],[94,102],[102,109],[109,117],[117,124]]}
};
const ZONES = {
  bust:  {pct:22, clr:'#3a7bd5', label:'Bust'},
  waist: {pct:50, clr:'#c4621a', label:'Waist'},
  hip:   {pct:78, clr:'#2e9e58', label:'Hip'},
};
const HINTS = {
  bust:  'Measure around the fullest part of your chest.',
  waist: 'Measure around the narrowest part of your torso.',
  hip:   'Measure around the fullest part of your hips and seat.',
};
const state = {type:'bust', unit:'in', value:''};

function drawTape(canvas){
  const dpr = window.devicePixelRatio||1;
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  if(!W||!H) return;
  canvas.width = W*dpr; canvas.height = H*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const dark = window.matchMedia('(prefers-color-scheme:dark)').matches;
  const clr  = dark ? 'rgba(200,180,100,0.32)' : 'rgba(100,80,20,0.22)';
  const clrM = dark ? 'rgba(200,180,100,0.55)' : 'rgba(100,80,20,0.42)';
  const steps = 32;
  const step  = W / steps;
  for(let i=0; i<=steps; i++){
    const x = i*step;
    const major = i%4===0;
    const th = major ? H*0.42 : H*0.26;
    ctx.strokeStyle = major ? clrM : clr;
    ctx.lineWidth   = major ? 1.2 : 0.8;
    ctx.beginPath();
    ctx.moveTo(x,0);       ctx.lineTo(x,th);
    ctx.moveTo(x,H);       ctx.lineTo(x,H-th);
    ctx.stroke();
  }
}

function buildCard(){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="guide-name">Garment sizing</div>
    <div class="guide-sub">Bust · Waist · Hip</div>
    <div class="tag-row">
      <span class="tag">Clothing</span>
      <span class="tag">Dress</span>
      <span class="tag">Tops</span>
    </div>

    <!-- Tape -->
    <div class="tape-wrap">
      <div class="tape-track">
        <canvas class="tape-canvas"></canvas>
        <div class="tape-anchors">
          ${Object.entries(ZONES).map(([k,z])=>`
            <div class="tape-anchor" data-zone="${k}" style="left:${z.pct}%">
              <div class="tape-anchor-label">${z.label}</div>
              <div class="tape-anchor-dot"></div>
            </div>`).join('')}
        </div>
        <div class="tape-indicator" id="tapeIndicator">
          <div class="tape-indicator-line"></div>
          <div class="tape-indicator-diamond"></div>
        </div>
      </div>
    </div>

    <!-- Measurement hero -->
    <div class="measure-hero">
      <div class="measure-prompt">Your measurement</div>
      <div class="measure-input-row">
        <input class="measure-input gValueInput" type="number"
          inputmode="decimal" step="0.5" placeholder="0" autocomplete="off">
        <span class="measure-unit gUnitLabel">in</span>
      </div>
      <div class="measure-hint gHint">${HINTS.bust}</div>
      <div class="result-badge gResult">
        <div class="r-label">Recommended size</div>
        <div class="r-val gSizeVal"></div>
        <div class="r-range gSizeRange"></div>
        <div class="r-note gSizeNote"></div>
      </div>
    </div>

    <!-- Unit -->
    <div class="section-head">Unit</div>
    <div class="unit-row" id="gUnitRow">
      <button class="unit-btn active" data-v="in">in</button>
      <button class="unit-btn" data-v="cm">cm</button>
    </div>

    <!-- Measurement point -->
    <div class="section-head">Measurement point</div>
    <div class="seg" id="gTypeSeg">
      <button data-v="bust" class="active">Bust</button>
      <button data-v="waist">Waist</button>
      <button data-v="hip">Hip</button>
    </div>

    <hr class="divider">

    <!-- Size chart -->
    <div class="section-head">Size chart</div>
    <table class="chart-table">
      <thead><tr><th>Size</th><th class="gChartHead">Range (in)</th></tr></thead>
      <tbody class="gChartBody"></tbody>
    </table>
    <div class="foot-note">Dresses are 51–52" in length. Measure over the fullest point.</div>
  `;

  /* tape */
  const canvas    = card.querySelector('.tape-canvas');
  const indicator = card.querySelector('#tapeIndicator');
  const anchors   = card.querySelectorAll('.tape-anchor');

  function setZone(type, pulse){
    const z = ZONES[type];
    indicator.style.left = z.pct + '%';
    indicator.querySelector('.tape-indicator-line').style.background    = z.clr;
    indicator.querySelector('.tape-indicator-diamond').style.background = z.clr;
    anchors.forEach(a=>{
      const on = a.dataset.zone === type;
      a.classList.toggle('active', on);
      a.querySelector('.tape-anchor-label').style.color      = on ? z.clr : '';
      a.querySelector('.tape-anchor-dot').style.background   = on ? z.clr : '';
    });
    card.querySelector('.gHint').textContent = HINTS[type];
    if(pulse){
      indicator.style.opacity = '0.3';
      requestAnimationFrame(()=>{
        setTimeout(()=>{ indicator.style.opacity = '1'; }, 80);
      });
    }
  }

  requestAnimationFrame(()=>{
    drawTape(canvas);
    setZone(state.type, false);
    card.querySelector('.gValueInput').focus();
  });
  window.addEventListener('resize', ()=> drawTape(canvas), {passive:true});

  /* tabs */
  card.querySelector('#gTypeSeg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    state.type = b.dataset.v;
    card.querySelectorAll('#gTypeSeg button').forEach(x=>x.classList.toggle('active',x===b));
    setZone(state.type, false);
    renderChart(card); calcSize(card);
  });

  /* unit */
  card.querySelector('#gUnitRow').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    state.unit = b.dataset.v;
    card.querySelectorAll('#gUnitRow button').forEach(x=>x.classList.toggle('active',x===b));
    card.querySelector('.gUnitLabel').textContent  = b.dataset.v;
    card.querySelector('.gChartHead').textContent  = 'Range ('+b.dataset.v+')';
    // clear value when switching units to avoid confusion
    card.querySelector('.gValueInput').value = '';
    state.value = '';
    card.querySelector('.gResult').style.display = 'none';
    renderChart(card);
  });

  /* input */
  card.querySelector('.gValueInput').addEventListener('input', function(){
    state.value = this.value;
    if(parseFloat(this.value)) setZone(state.type, true);
    calcSize(card);
  });

  /* highlight input border with zone colour on focus */
  card.querySelector('.gValueInput').addEventListener('focus', function(){
    this.style.borderColor = ZONES[state.type].clr;
  });
  card.querySelector('.gValueInput').addEventListener('blur', function(){
    this.style.borderColor = '';
  });

  renderChart(card);
  return card;
}

function renderChart(card){
  const rows = chartData[state.type][state.unit];
  const v    = parseFloat(state.value);
  card.querySelector('.gChartBody').innerHTML = rows.map((r,i)=>{
    const hl = !isNaN(v) && v>=r[0] && v<=r[1];
    return `<tr class="${hl?'hl':''}"><td>${sizes[i]}</td><td>${r[0]}–${r[1]}</td></tr>`;
  }).join('');
}

function calcSize(card){
  const v   = parseFloat(state.value);
  const res = card.querySelector('.gResult');
  if(!v){ res.style.display='none'; renderChart(card); return; }
  const rows    = chartData[state.type][state.unit];
  const matches = rows.reduce((a,r,i)=> r[0]<=v&&v<=r[1] ? [...a,i] : a, []);
  if(!matches.length){
    card.querySelector('.gSizeVal').textContent   = 'Out of range';
    card.querySelector('.gSizeRange').textContent = '';
    card.querySelector('.gSizeNote').style.display = 'none';
    res.style.display = 'block'; renderChart(card); return;
  }
  const idx = matches[matches.length-1];
  card.querySelector('.gSizeVal').textContent   = sizes[idx];
  card.querySelector('.gSizeRange').textContent = rows[idx][0]+'–'+rows[idx][1]+' '+state.unit;
  const note = card.querySelector('.gSizeNote');
  if(matches.length>1){
    note.textContent     = 'Between sizes — relaxed fit recommended.';
    note.style.display   = 'block';
  } else {
    note.style.display   = 'none';
  }
  res.style.display = 'block';
  renderChart(card);
}

document.getElementById('cardGrid').appendChild(buildCard());
</script>
</body>
</html>
